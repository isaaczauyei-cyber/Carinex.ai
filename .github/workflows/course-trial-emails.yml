name: Carinex Course Trial Emails

on:
  workflow_dispatch:

jobs:
  diagnose-redirect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production URL redirect
        env:
          SITE_URL: ${{ secrets.CARINEX_SITE_URL }}
        run: |
          set -eu

          echo "Checking configured production URL..."

          curl --silent --show-error \
            --max-time 30 \
            --output /dev/null \
            --dump-header /tmp/headers.txt \
            "${SITE_URL%/}/api/cron/course-trial-emails"

          echo "Response headers:"
          grep -iE '^(HTTP/|location:)' /tmp/headers.txt || true
